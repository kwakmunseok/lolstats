services:
  app:
    image: ghcr.io/kwakmunseok/lolstats:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/lolstats
      REDIS_HOST: redis
    # Nginx가 80/443에서 프록시하고 여기로 넘김 - 앱 포트를 인터넷에 직접 노출할 필요 없음
    # (도메인/HTTPS 붙이기 전엔 IP:8080 직접 접속용으로 0.0.0.0 바인딩했었음).
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mysql
      - redis

  # DB/Redis 포트는 호스트에 노출하지 않음 (PROJECT_PLAN.md §9.8 prod 보안 — 로컬 compose와 분리).
  # app 컨테이너만 같은 compose 네트워크로 접근.
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lolstats
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
