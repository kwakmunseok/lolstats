name: CI/CD

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    # docker-compose.yml(dev)과 동일한 포트/계정 - RepositoryIntegrationTest, LolstatsApplicationTests가
    # dev 프로필로 진짜 MySQL/Redis에 붙는다 (PROJECT_PLAN.md §9.4가 말한 "DB 불필요" 전제와 달리
    # 실제로는 통합 테스트가 붙어있음 - H2 미채용 이유는 RepositoryIntegrationTest 주석 참고).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lolstats
          MYSQL_USER: lolstats
          MYSQL_PASSWORD: lolstats
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: dev
          # RIOT_API_KEY/JWT_SECRET는 컨텍스트 로딩에만 쓰이고 실제 Riot API 호출이나
          # 서명 검증엔 안 쓰임(테스트는 전부 모킹) - 진짜 값일 필요 없어 Secret 등록 불필요.
          RIOT_API_KEY: ci-dummy-key
          JWT_SECRET: ci-dummy-secret-not-for-prod

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lolstats:latest
            ghcr.io/${{ github.repository_owner }}/lolstats:${{ github.sha }}

  # GitHub 호스팅 러너에서 EC2로 SSH 인바운드가 계속 TCP 단계에서 timeout(appleboy/ssh-action, 순수 ssh,
  # bash /dev/tcp 전부 동일 실패 - 보안그룹/NACL/OS 방화벽은 전부 확인 완료, CloudShell에서는 접속 성공함.
  # 신규 AWS 계정 대상 자동 방어에 GitHub Actions 러너 대역이 걸린 것으로 추정). EC2에 셀프 호스티드
  # 러너를 직접 설치해 인바운드 SSH 자체를 없앰 - 이 job은 EC2 박스 위에서 로컬로 실행됨.
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      # docker-compose.prod.yml을 저장소에서 항상 동기화 - 이전엔 서버에 놓인 사본을 그냥 재사용해서
      # 레포에서 파일을 고쳐도(GHCR 오타 수정 등) 수동으로 다시 scp하기 전까진 반영이 안 됐음.
      - name: Sync compose file and deploy
        run: |
          cp docker-compose.prod.yml ~/lolstats/docker-compose.prod.yml
          cd ~/lolstats
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
