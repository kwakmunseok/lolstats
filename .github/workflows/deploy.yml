name: CI/CD

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    # docker-compose.yml(dev)과 동일한 포트/계정 - RepositoryIntegrationTest, LolstatsApplicationTests가
    # dev 프로필로 진짜 MySQL/Redis에 붙는다 (PROJECT_PLAN.md §9.4가 말한 "DB 불필요" 전제와 달리
    # 실제로는 통합 테스트가 붙어있음 - H2 미채용 이유는 RepositoryIntegrationTest 주석 참고).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lolstats
          MYSQL_USER: lolstats
          MYSQL_PASSWORD: lolstats
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: dev
          # RIOT_API_KEY/JWT_SECRET는 컨텍스트 로딩에만 쓰이고 실제 Riot API 호출이나
          # 서명 검증엔 안 쓰임(테스트는 전부 모킹) - 진짜 값일 필요 없어 Secret 등록 불필요.
          RIOT_API_KEY: ci-dummy-key
          JWT_SECRET: ci-dummy-secret-not-for-prod

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lolstats:latest
            ghcr.io/${{ github.repository_owner }}/lolstats:${{ github.sha }}
      # 선행 조건(PHASE5_PLAN.md §0): EC2 인스턴스 + ~/lolstats에 docker-compose.prod.yml, .env 배치 완료 후에만 동작.
      # appleboy/ssh-action 대신 순수 ssh 사용 - 반복된 "dial tcp ***:22: i/o timeout"이 진짜 네트워크
      # 차단인지, 액션의 시크릿 처리(호스트 값 공백/개행 등) 문제인지 구분하기 위한 진단 겸 단순화.
      - name: Deploy to EC2
        env:
          RAW_EC2_HOST: ${{ secrets.EC2_HOST }}
          RAW_EC2_USER: ${{ secrets.EC2_USER }}
          RAW_EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          EC2_HOST=$(echo "$RAW_EC2_HOST" | tr -d '[:space:]')
          EC2_USER=$(echo "$RAW_EC2_USER" | tr -d '[:space:]')
          mkdir -p ~/.ssh
          printf '%s\n' "$RAW_EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "TCP reachability check on port 22:"
          timeout 10 bash -c "echo > /dev/tcp/${EC2_HOST}/22" && echo "TCP: reachable" || echo "TCP: FAILED"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "${EC2_USER}@${EC2_HOST}" \
            'cd ~/lolstats && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d'
