<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='LoL Stats - 소환사 검색')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 640px;">
    <h1 class="mb-4 text-center">소환사 검색</h1>

    <form id="searchForm" class="d-flex position-relative mb-1" autocomplete="off">
        <input type="text" id="riotIdInput" class="form-control me-2"
               placeholder="게임이름#태그 (예: Hide on bush#KR1)"
               maxlength="22" pattern="^[^#]{3,16}#[A-Za-z0-9]{3,5}$"
               title="게임이름(3~16자)#태그라인(3~5자) 형식으로 입력하세요" required>
        <button class="btn btn-primary" type="submit">검색</button>
        <div id="autocompleteResults" class="list-group position-absolute top-100 start-0 w-100"
             style="z-index: 10;"></div>
    </form>
    <div id="searchFeedback" class="form-text text-danger d-none mb-4">
        게임이름#태그라인 형식으로 입력하세요 (예: Hide on bush#KR1)
    </div>

    <section class="mb-4">
        <h2 class="h6 text-muted">최근 검색</h2>
        <div id="recentSearches"></div>
    </section>

    <section>
        <h2 class="h6 text-muted">인기 검색어</h2>
        <div id="popularSearches"></div>
    </section>
</main>

<script>
    const input = document.getElementById('riotIdInput');
    const feedback = document.getElementById('searchFeedback');
    const resultsBox = document.getElementById('autocompleteResults');

    function goToProfile(gameName, tagLine) {
        window.location.href = `/summoners/${encodeURIComponent(gameName)}/${encodeURIComponent(tagLine)}`;
    }

    input.addEventListener('input', () => {
        feedback.classList.toggle('d-none', input.checkValidity());

        const query = input.value.split('#')[0].trim();
        if (query.length < 2) {
            resultsBox.innerHTML = '';
            return;
        }
        fetch(`/api/summoners/autocomplete?query=${encodeURIComponent(query)}&limit=8`)
            .then(r => r.json())
            .then(items => {
                resultsBox.innerHTML = items.map(s =>
                    `<a class="list-group-item list-group-item-action" href="/summoners/${encodeURIComponent(s.gameName)}/${encodeURIComponent(s.tagLine)}">${s.gameName}#${s.tagLine}</a>`
                ).join('');
            })
            .catch(() => {});
    });

    document.getElementById('searchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!input.checkValidity()) {
            feedback.classList.remove('d-none');
            return;
        }
        const idx = input.value.lastIndexOf('#');
        goToProfile(input.value.slice(0, idx).trim(), input.value.slice(idx + 1).trim());
    });

    const recent = JSON.parse(localStorage.getItem('recentSearches') || '[]');
    document.getElementById('recentSearches').innerHTML = recent.length
        ? recent.map(r =>
            `<a class="badge text-bg-secondary text-decoration-none me-1 mb-1" href="/summoners/${encodeURIComponent(r.gameName)}/${encodeURIComponent(r.tagLine)}">${r.gameName}#${r.tagLine}</a>`
        ).join('')
        : '<span class="text-muted">최근 검색 기록이 없습니다</span>';

    fetch('/api/summoners/popular?limit=10')
        .then(r => r.json())
        .then(items => {
            document.getElementById('popularSearches').innerHTML = items.length
                ? items.map(s =>
                    `<a class="badge text-bg-primary text-decoration-none me-1 mb-1" href="/summoners/${encodeURIComponent(s.gameName)}/${encodeURIComponent(s.tagLine)}">${s.gameName}#${s.tagLine}</a>`
                ).join('')
                : '<span class="text-muted">아직 인기 검색어가 없습니다</span>';
        })
        .catch(() => {});
</script>
</body>
</html>
