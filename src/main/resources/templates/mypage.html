<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='마이페이지 - LoL Stats')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 640px;">
    <h1 class="mb-4 h4">마이페이지</h1>

    <section class="mb-5">
        <h2 class="h6 text-muted mb-3">즐겨찾기</h2>
        <p th:if="${#lists.isEmpty(favorites)}" class="text-muted">즐겨찾기한 소환사가 없습니다.</p>
        <div th:each="f : ${favorites}" class="card mb-2">
            <div class="card-body d-flex align-items-center justify-content-between py-2">
                <a th:href="@{/summoners/{gameName}/{tagLine}(gameName=${f.gameName},tagLine=${f.tagLine})}"
                   class="text-decoration-none text-body">
                    <span th:text="${f.gameName} + '#' + ${f.tagLine}">GameName#TAG</span>
                    <span th:if="${f.tier}" class="text-muted small ms-2"
                          th:text="${f.tier} + ' ' + ${f.rank} + ' ' + ${f.leaguePoints} + 'LP'">TIER RANK LP</span>
                </a>
                <button type="button" class="btn btn-sm btn-outline-danger favorite-remove-btn"
                        th:attr="data-summoner-id=${f.summonerId}">제거</button>
            </div>
        </div>
    </section>

    <section>
        <h2 class="h6 text-muted mb-3">최근 검색 기록</h2>
        <p th:if="${#lists.isEmpty(history)}" class="text-muted">검색 기록이 없습니다.</p>
        <a th:each="h : ${history}"
           th:href="@{/summoners/{gameName}/{tagLine}(gameName=${h.gameName},tagLine=${h.tagLine})}"
           class="d-block text-decoration-none text-body border-bottom py-2">
            <span th:text="${h.gameName} + '#' + ${h.tagLine}">GameName#TAG</span>
        </a>
    </section>
</main>
<script>
    document.querySelectorAll('.favorite-remove-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
            const xsrfToken = document.cookie.match(/(?:^| )XSRF-TOKEN=([^;]+)/)?.[1];
            fetch(`/api/users/me/favorites/${btn.dataset.summonerId}`, {
                method: 'DELETE',
                headers: {'X-XSRF-TOKEN': decodeURIComponent(xsrfToken || '')},
            }).then((res) => {
                if (res.ok) {
                    btn.closest('.card').remove();
                }
            });
        });
    });
</script>
</body>
</html>
