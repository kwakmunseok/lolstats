<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='매치 상세 - LoL Stats')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
    <p class="text-muted mb-3">
        <span th:text="${queueType}">420</span> ·
        <span th:text="${duration}">30:00</span> ·
        <span th:text="${playedAt}">2026-01-01</span>
    </p>

    <h2 class="h6 text-primary">팀 1</h2>
    <div class="table-responsive mb-4">
        <table class="table table-sm align-middle">
            <tbody>
            <tr th:each="p : ${team1}" th:classappend="${p.win} ? 'table-primary' : 'table-danger'">
                <td class="d-flex align-items-center gap-2">
                    <img th:if="${p.championImageUrl}" th:src="${p.championImageUrl}" width="32" height="32"
                         class="rounded" alt="">
                    <span th:text="${p.championName}">Champion</span>
                </td>
                <td th:text="${p.gameName} + '#' + ${p.tagLine}">Name#TAG</td>
                <td th:text="${p.kills} + ' / ' + ${p.deaths} + ' / ' + ${p.assists}">0 / 0 / 0</td>
                <td>
                    <img th:if="${p.spell1ImageUrl}" th:src="${p.spell1ImageUrl}" width="20" height="20" alt="">
                    <img th:if="${p.spell2ImageUrl}" th:src="${p.spell2ImageUrl}" width="20" height="20" alt="">
                </td>
                <td>
                    <img th:if="${p.keystoneIconUrl}" th:src="${p.keystoneIconUrl}" width="20" height="20" alt="">
                    <img th:if="${p.secondaryStyleIconUrl}" th:src="${p.secondaryStyleIconUrl}" width="20"
                         height="20" alt="">
                </td>
                <td>
                    <span th:each="item : ${p.items}">
                        <img th:if="${item}" th:src="${item.imageUrl}" width="24" height="24" class="rounded"
                             alt="아이템" data-bs-toggle="popover" data-bs-html="true" data-bs-trigger="hover focus"
                             th:attr="data-bs-title=${item.name},data-bs-content=${item.description}">
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <h2 class="h6 text-danger">팀 2</h2>
    <div class="table-responsive mb-4">
        <table class="table table-sm align-middle">
            <tbody>
            <tr th:each="p : ${team2}" th:classappend="${p.win} ? 'table-primary' : 'table-danger'">
                <td class="d-flex align-items-center gap-2">
                    <img th:if="${p.championImageUrl}" th:src="${p.championImageUrl}" width="32" height="32"
                         class="rounded" alt="">
                    <span th:text="${p.championName}">Champion</span>
                </td>
                <td th:text="${p.gameName} + '#' + ${p.tagLine}">Name#TAG</td>
                <td th:text="${p.kills} + ' / ' + ${p.deaths} + ' / ' + ${p.assists}">0 / 0 / 0</td>
                <td>
                    <img th:if="${p.spell1ImageUrl}" th:src="${p.spell1ImageUrl}" width="20" height="20" alt="">
                    <img th:if="${p.spell2ImageUrl}" th:src="${p.spell2ImageUrl}" width="20" height="20" alt="">
                </td>
                <td>
                    <img th:if="${p.keystoneIconUrl}" th:src="${p.keystoneIconUrl}" width="20" height="20" alt="">
                    <img th:if="${p.secondaryStyleIconUrl}" th:src="${p.secondaryStyleIconUrl}" width="20"
                         height="20" alt="">
                </td>
                <td>
                    <span th:each="item : ${p.items}">
                        <img th:if="${item}" th:src="${item.imageUrl}" width="24" height="24" class="rounded"
                             alt="아이템" data-bs-toggle="popover" data-bs-html="true" data-bs-trigger="hover focus"
                             th:attr="data-bs-title=${item.name},data-bs-content=${item.description}">
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<!-- 이 화면에서만 쓰여서 공용 layout.html이 아니라 여기서 직접 로드(profile.html과 동일 패턴 -
     data-bs-toggle="popover" 아이템 툴팁에 필요) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // sanitize:false - Bootstrap's default sanitizer strips unknown tags (and their text) entirely,
    // and Data Dragon descriptions use its own custom tags (<mainText>, <attention>, ...) that aren't
    // in Bootstrap's allow-list, so this content would render empty otherwise. Safe here: it's server-
    // fetched from Riot's Data Dragon CDN, not user input.
    document.querySelectorAll('[data-bs-toggle="popover"]').forEach(el => new bootstrap.Popover(el, {sanitize: false}));
</script>
</body>
</html>
