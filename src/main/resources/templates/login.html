<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='로그인 - LoL Stats')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 400px;">
    <h1 class="mb-4 text-center h4">로그인</h1>

    <form id="loginForm">
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" id="password" class="form-control" required>
        </div>
        <div id="loginError" class="alert alert-danger d-none"></div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>
    <p class="text-center text-muted small mt-3">
        계정이 없으신가요? <a href="/signup">회원가입</a>
    </p>
</main>
<script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const errorBox = document.getElementById('loginError');
        errorBox.classList.add('d-none');
        fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            }),
        }).then(async (res) => {
            if (res.ok) {
                window.location.href = '/';
                return;
            }
            const body = await res.json().catch(() => ({}));
            errorBox.textContent = body.detail || '로그인에 실패했습니다';
            errorBox.classList.remove('d-none');
        }).catch(() => {
            errorBox.textContent = '로그인에 실패했습니다';
            errorBox.classList.remove('d-none');
        });
    });
</script>
</body>
</html>
