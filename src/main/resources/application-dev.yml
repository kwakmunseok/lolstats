spring:
  datasource:
    url: jdbc:mysql://localhost:3307/lolstats
    username: ${DB_USERNAME:lolstats}
    password: ${DB_PASSWORD:lolstats}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  thymeleaf:
    cache: false
  data:
    redis:
      host: localhost
      port: 6379
      # Lettuce's default command timeout is 60s - far too long for the fail-open paths
      # (Phase 2 Task 3~6) to actually feel "open" during an outage. Same-host Redis normally
      # responds in low single-digit ms, so 500ms is generous while still failing fast.
      timeout: 500ms

server:
  port: 8080

riot:
  api:
    key: ${RIOT_API_KEY}
    platform-url: https://kr.api.riotgames.com
    regional-url: https://asia.api.riotgames.com

app:
  cache:
    summoner-ttl-minutes: 10
  jwt:
    # 로컬 dev는 http라 Secure 쿠키면 브라우저가 아예 보내지 않음(application.yml 기본은 prod용 true).
    cookie-secure: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
