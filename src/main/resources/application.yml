spring:
  application:
    name: lolstats
  profiles:
    active: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: true

ddragon:
  base-url: https://ddragon.leagueoflegends.com
  refresh-interval-hours: 24

app:
  jwt:
    secret: ${JWT_SECRET}
    # PHASE5_PLAN.md §5 미결 기본값 - 범위(§6: access 15~30분, refresh 7~14일) 안에서 느슨하게 시작.
    access-token-minutes: 30
    refresh-token-days: 14
    # prod은 HTTPS 전제(§9.3)라 Secure 쿠키 필수 - dev는 로컬 http라 false로 오버라이드(application-dev.yml).
    cookie-secure: true
