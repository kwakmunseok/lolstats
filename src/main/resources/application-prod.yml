spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 마이그레이션 도구(Flyway 등) 미도입 - 1인 개발 학습 프로젝트 규모에 맞춰 dev와 동일하게 update.
      # 컬럼 삭제/이름변경 리팩터링 시 옛 컬럼이 안 지워지고 남는 schema drift 위험은 있음(트레이드오프 인지).
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:500ms}

server:
  port: 8080
  # Nginx가 80/443에서 프록시(PROJECT_PLAN.md §9.2) - 이거 없으면 per-IP 제한이 전부 Nginx
  # IP 하나로 뭉치고, Secure 쿠키/리다이렉트도 요청을 HTTP로 오인해 오동작함.
  forward-headers-strategy: framework

riot:
  api:
    key: ${RIOT_API_KEY}
    platform-url: https://kr.api.riotgames.com
    regional-url: https://asia.api.riotgames.com

app:
  cache:
    summoner-ttl-minutes: 10
