services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lolstats
      MYSQL_USER: lolstats
      MYSQL_PASSWORD: lolstats
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
